name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Prepare deploy folder
        run: |
          mkdir -p dist
          cp *.html dist/
          cp -r assets dist/

      - name: Cache-bust CSS/JS references
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          for f in dist/*.html; do
            sed -i \
              -e "s|assets/css/styles\.css\"|assets/css/styles.css?v=${SHA_SHORT}\"|g" \
              -e "s|assets/js/i18n\.js\"|assets/js/i18n.js?v=${SHA_SHORT}\"|g" \
              -e "s|assets/js/main\.js\"|assets/js/main.js?v=${SHA_SHORT}\"|g" \
              "$f"
          done
          TAG=$(grep -o 'src="assets/js/main\.js[^"]*"' dist/index.html || true)
          echo "::notice::cache-bust result for dist/index.html main.js tag: ${TAG}"
          if [[ "$TAG" != *"?v="* ]]; then
            echo "::error::Cache-bust sed did not modify dist/index.html. SHA_SHORT='${SHA_SHORT}' TAG='${TAG}'"
            exit 1
          fi

      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp

      - name: Deploy over SFTP to Hostinger (with auto-retry)
        timeout-minutes: 15
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          TAG=$(grep -o 'src="assets/js/main\.js[^"]*"' dist/index.html || true)
          echo "::notice::right before mirror, dist/index.html main.js tag: ${TAG}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 65002 sftp://$FTP_SERVER <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 6
          set net:reconnect-interval-base 15
          set net:reconnect-interval-multiplier 1
          set net:reconnect-interval-max 30
          set net:timeout 30
          set mirror:use-pget-n 1
          mirror -R --verbose --parallel=2 dist public_html
          get public_html/index.html -o verify-index.html
          bye
          EOF
          TAG2=$(grep -o 'src="assets/js/main\.js[^"]*"' verify-index.html || true)
          echo "::notice::right after mirror, remote public_html/index.html main.js tag: ${TAG2}"
